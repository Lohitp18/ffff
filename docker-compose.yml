services:
  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: alumni_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-adminpassword}
      MONGO_INITDB_DATABASE: alumni_portal
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    ports:
      - "27017:27017"
    networks:
      - alumni_network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Backend API Server
  backend:
    build:
      context: ./alumni_portal_backend
      dockerfile: Dockerfile
    container_name: alumni_backend
    restart: unless-stopped
    env_file:
      # Put backend secrets/config here. Read directly by the container.
      - ./alumni_portal_backend/.env
    environment:
      - NODE_ENV=production
      - PORT=5000
    volumes:
      - backend_uploads:/app/uploads
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    networks:
      - alumni_network
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5000/api/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Web Frontend
  web:
    build:
      context: ./alumniportal_web
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=

    container_name: alumni_web
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - alumni_network

networks:
  alumni_network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  backend_uploads:
    driver: local
